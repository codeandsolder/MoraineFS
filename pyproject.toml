[project]
name = "morainefs-tools"
version = "0.1.0"
description = "Development tooling for MoraineFS"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff==0.16.10"]

[tool.uv]
required-version = "==0.12.19"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PERF", "RUF", "EXE"]
