[package]
name = "morainefs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-2.0-only"
publish = false

[package.metadata.rust-skills2]
allow-test-panics = true
allow-test-panics-reason = "Tests use panic-style assertions and unwraps; production targets remain strict"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
ctrlc = { version = "3.5.2", features = ["termination"] }
fuser = "0.18.0"
libc = "0.2.190"
parking_lot = "0.13.0"
rayon = "1.12.0"
rustix = { version = "1.1.5", features = ["fs", "process"] }
socket2 = "0.6.5"
thiserror = "2.0.21"
walkdir = "2.5.0"
xattr = "1.6.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[[bin]]
name = "moraine-checkpoint"
path = "src/bin/moraine_checkpoint.rs"

[[bin]]
name = "moraine-admit"
path = "src/bin/moraine_admit.rs"

[[bin]]
name = "moraine-range-cache-gc"
path = "src/bin/moraine_range_cache_gc.rs"

[[bin]]
name = "morainefs"
path = "src/bin/morainefs.rs"
