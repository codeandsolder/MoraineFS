name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@d3d509b57a06e72885a83ae743a4014e97cd9f95 # main
    with:
      command: make check
