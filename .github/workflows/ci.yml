name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5b72e3865937d6e85e9ea485af9d04ec83343c5f # main
    with:
      command: make check
