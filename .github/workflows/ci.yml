name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfuse3-dev pkg-config gcc shellcheck
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Sync Python tooling
        run: uv sync --locked
      - name: Lint and test
        run: make check
      - name: ShellCheck
        run: shellcheck tools/setup-zram.sh
